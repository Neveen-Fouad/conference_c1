<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verification</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
            width: 100%;
            max-width: 480px;
            padding: 40px;
            text-align: center;
        }
        .icon-box {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }
        .icon-box.loading {
            background-color: #eff6ff;
            color: #2563eb;
        }
        .icon-box.success {
            background-color: #f0fdf4;
            color: #16a34a;
        }
        .icon-box.error {
            background-color: #fef2f2;
            color: #dc2626;
        }
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #bfdbfe;
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h1 {
            font-size: 22px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 12px;
        }
        p {
            font-size: 15px;
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .btn {
            display: inline-block;
            background-color: #2563eb;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            transition: background-color 0.2s ease;
            border: none;
            cursor: pointer;
        }
        .btn:hover {
            background-color: #1d4ed8;
        }
        .redirect-notice {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 16px;
        }
    </style>
</head>
<body>

<div class="card" id="card">
    <div class="icon-box loading" id="icon-box">
        <div class="spinner" id="spinner"></div>
    </div>
    <h1 id="title">Verifying Your Email...</h1>
    <p id="message">Please wait while we verify your email address.</p>
    <div id="action-area"></div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const titleEl = document.getElementById('title');
        const messageEl = document.getElementById('message');
        const iconBox = document.getElementById('icon-box');
        const actionArea = document.getElementById('action-area');

        // Extract query parameters with fallbacks for HTML-encoded amp; prefixes
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');
        const hash = urlParams.get('hash') || urlParams.get('amp;hash');
        const expires = urlParams.get('expires') || urlParams.get('amp;expires');
        const signature = urlParams.get('signature') || urlParams.get('amp;signature');

        if (!id || !hash || !expires || !signature) {
            showError('Invalid Verification Link', 'The verification link is incomplete or missing required parameters.');
            return;
        }

        // Detect backend URL (defaults to origin or standard backend host)
        const apiBaseUrl = window.location.origin.includes(':3000') 
            ? 'http://127.0.0.1:8000' 
            : window.location.origin;

        const verifyApiEndpoint = `${apiBaseUrl}/api/auth/email/verify/${id}/${hash}?expires=${expires}&signature=${signature}`;

        try {
            const response = await fetch(verifyApiEndpoint, {
                method: 'GET',
                headers: {
                    'Accept': 'application/json'
                }
            });

            const data = await response.json();

            if (response.ok) {
                showSuccess('Email Verified Successfully!', data.message || 'Your email address has been verified. Redirecting to home page...');
                setTimeout(() => {
                    window.location.href = '/';
                }, 2500);
            } else {
                showError('Verification Failed', data.message || 'This verification link is invalid or has expired.');
            }
        } catch (err) {
            console.error('Verification error:', err);
            showError('Connection Error', 'Unable to reach the server. Please try again later.');
        }

        function showSuccess(title, message) {
            iconBox.className = 'icon-box success';
            iconBox.innerHTML = `
                <svg width="32" height="32" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                </svg>`;
            titleEl.textContent = title;
            messageEl.textContent = message;
            actionArea.innerHTML = `
                <a href="/" class="btn">Go to Homepage</a>
                <div class="redirect-notice">Redirecting automatically in 2 seconds...</div>`;
        }

        function showError(title, message) {
            iconBox.className = 'icon-box error';
            iconBox.innerHTML = `
                <svg width="32" height="32" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>`;
            titleEl.textContent = title;
            messageEl.textContent = message;
            actionArea.innerHTML = `<a href="/" class="btn">Return to Home</a>`;
        }
    });
</script>

</body>
</html>
